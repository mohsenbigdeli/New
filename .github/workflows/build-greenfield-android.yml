name: Build Greenfield Farm Android

on:
  push:
    paths:
      - 'greenfield-farm/**'
      - '.github/workflows/build-greenfield-android.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Export Android APK with Godot 4.7.2
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./greenfield-farm
          presets_to_export: Android
          export_debug: true
          verbose: true

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p artifact
          echo "Build directory: ${{ steps.export.outputs.build_directory }}"
          find "${{ steps.export.outputs.build_directory }}" -maxdepth 5 -type f -print || true
          APK=$(find "${{ steps.export.outputs.build_directory }}" -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK found"
            exit 1
          fi
          cp "$APK" artifact/GreenfieldFarm-v0.1-debug.apk
          ls -lh artifact/GreenfieldFarm-v0.1-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GreenfieldFarm-Android
          path: artifact/GreenfieldFarm-v0.1-debug.apk
          if-no-files-found: error
          retention-days: 14
